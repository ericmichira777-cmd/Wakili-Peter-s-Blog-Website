---
layout: default
---

<article class="blog-post">

    <header class="post-header">
        <h1>{{ page.title }}</h1>

        <div class="post-meta">
            <span>{{ page.date | date: "%B %d, %Y" }}</span>
            <span>{{ page.read_time }} min read</span>
            <span>{{ page.author }}</span>
        </div>

        {% if page.image %}
            <img
                src="{{ page.image | relative_url }}"
                alt="{{ page.title }}"
                class="post-image"
            >
        {% endif %}
    </header>

    <div class="post-content">
        {{ content }}
    </div>

</article>
